name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  Build-Linux:
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: "Set compiler"
        if: matrix.compiler == 'clang'
        # Ubuntu's clang 18 hides libstdc++'s <expected> (it reports __cpp_concepts
        # 201907L, below the 202002L libstdc++ requires); use clang 20 from apt.llvm.org.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-20
          echo "CC=clang-20" >> $GITHUB_ENV
          echo "CXX=clang++-20" >> $GITHUB_ENV

      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DPGPP_BUILD_TESTS=ON -DPGPP_WARNINGS_AS_ERRORS=ON -G "Unix Makefiles" -B build
          cmake --build build --config ${{matrix.build_type}} -j $(nproc)

      - name: "Unit tests"
        env:
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/unit-tests.xml
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R pgpp_unit_tests

      - name: "Integration tests"
        env:
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/integration-tests.xml
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R pgpp_integration_tests

      - name: "Test report"
        uses: dorny/test-reporter@v3
        # Fork PRs get a read-only GITHUB_TOKEN, so creating the check run would fail
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: "Tests / Linux ${{matrix.compiler}} ${{matrix.build_type}}"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false   # a failed build is already red; don't add a second failure


  ThreadSanitizer:
    # Data races are invisible to the ordinary legs; this one runs the whole suite
    # under TSan and fails on the first report.
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          # TSan on recent kernels needs a smaller ASLR entropy than the default 32 bits.
          sudo sysctl vm.mmap_rnd_bits=28

      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Debug -DPGPP_BUILD_TESTS=ON -DPGPP_WARNINGS_AS_ERRORS=ON \
                -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
                -G "Unix Makefiles" -B build
          cmake --build build -j $(nproc)

      - name: "Unit tests"
        env:
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/unit-tests.xml
        run: ctest --test-dir build --output-on-failure -R pgpp_unit_tests

      - name: "Integration tests"
        env:
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/integration-tests.xml
        run: ctest --test-dir build --output-on-failure -R pgpp_integration_tests

      - name: "Test report"
        uses: dorny/test-reporter@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: "Tests / ThreadSanitizer"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false


  AddressSanitizer:
    # Memory errors, leaks and undefined behaviour: the whole suite under
    # ASan + UBSan, failing on the first report.
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Debug -DPGPP_BUILD_TESTS=ON -DPGPP_WARNINGS_AS_ERRORS=ON \
                "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" \
                "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
                -G "Unix Makefiles" -B build
          cmake --build build -j $(nproc)

      - name: "Unit tests"
        env:
          ASAN_OPTIONS: "detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/unit-tests.xml
        run: ctest --test-dir build --output-on-failure -R pgpp_unit_tests

      - name: "Integration tests"
        env:
          ASAN_OPTIONS: "detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/integration-tests.xml
        run: ctest --test-dir build --output-on-failure -R pgpp_integration_tests

      - name: "Test report"
        uses: dorny/test-reporter@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: "Tests / AddressSanitizer"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false


  PostgreSQL-Versions:
    # The supported server range (REQ-PGPP-056); 16 is what every other job runs.
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 17]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DPGPP_BUILD_TESTS=ON -G "Unix Makefiles" -B build
          cmake --build build -j $(nproc)

      - name: "Integration tests"
        env:
          PGPP_TEST_PG_IMAGE: "postgres:${{matrix.pg}}-alpine"
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/integration-tests.xml
        run: ctest --test-dir build --output-on-failure -R pgpp_integration_tests

      - name: "Test report"
        uses: dorny/test-reporter@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: "Tests / PostgreSQL ${{matrix.pg}}"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false


  Build-Windows:
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Build
        shell: bash
        run: |
          cmake -DPostgreSQL_ROOT="$PGROOT" -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DPGPP_BUILD_TESTS=ON -B build
          cmake --build build --config ${{matrix.build_type}} -j $NUMBER_OF_PROCESSORS

      - name: "Unit tests"
        env:
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/unit-tests.xml
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R pgpp_unit_tests

      - name: "Setup PostgreSQL"
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgres-version: "16"
          username: postgres
          password: pgpp_test_pass
          database: pgpp_test
          port: 15432

      - name: "Integration tests"
        env:
          PGPP_SKIP_DOCKER: "1"
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/integration-tests.xml
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R pgpp_integration_tests

      - name: "Test report"
        uses: dorny/test-reporter@v3
        # Fork PRs get a read-only GITHUB_TOKEN, so creating the check run would fail
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: "Tests / Windows ${{matrix.build_type}}"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false   # a failed build is already red; don't add a second failure


  Build-MacOS:
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: "Install dependencies"
        run: brew install libpq

      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DPGPP_BUILD_TESTS=ON -DPGPP_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix libpq)" -G "Unix Makefiles" -B build
          cmake --build build --config ${{matrix.build_type}} -j $(sysctl -n hw.ncpu)

      - name: "Unit tests"
        env:
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/unit-tests.xml
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R pgpp_unit_tests

      - name: "Setup PostgreSQL"
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgres-version: "16"
          username: postgres
          password: pgpp_test_pass
          database: pgpp_test
          port: 15432

      - name: "Integration tests"
        env:
          PGPP_SKIP_DOCKER: "1"
          GTEST_OUTPUT: xml:${{github.workspace}}/test-results/integration-tests.xml
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R pgpp_integration_tests

      - name: "Test report"
        uses: dorny/test-reporter@v3
        # Fork PRs get a read-only GITHUB_TOKEN, so creating the check run would fail
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: "Tests / macOS ${{matrix.build_type}}"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false   # a failed build is already red; don't add a second failure


  CodeChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Install LLVM and dependencies"
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-20 clang-tidy-20 libpq-dev

      - name: "Install CodeChecker"
        run: |
          python3 -m venv /tmp/codechecker-venv
          /tmp/codechecker-venv/bin/pip install codechecker
          echo "/tmp/codechecker-venv/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v6

      - name: "Build for analysis"
        # Name the versioned binaries: the runner's /usr/bin/clang++ is clang 18,
        # which cannot see libstdc++'s <expected>. The analyzers are pinned the
        # same way through CC_ANALYZER_BIN below. The tests are built too, so
        # the headers are analysed as instantiated by real callers.
        run: |
          cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPGPP_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -G "Unix Makefiles" \
            -B build
          cmake --build build --config Debug -j $(nproc)

      - name: "Run analysis"
        env:
          CC_ANALYZER_BIN: "clangsa:/usr/bin/clang-20;clang-tidy:/usr/bin/clang-tidy-20"
        run: |
          echo "-/usr/include/*" > skipfile.txt
          echo "-$(pwd)/build*" >> skipfile.txt

          mkdir codechecker-reports
          CodeChecker analyze \
            -i skipfile.txt \
            -j $(nproc) \
            -o report \
            build/compile_commands.json \
            --analyzers clang-tidy clangsa \
            --config .codechecker.json
          CodeChecker parse ./report --trim-path-prefix "$(pwd)" | tee ./codechecker-reports/results.txt || true
          CodeChecker parse ./report --trim-path-prefix "$(pwd)" -e html -o ./codechecker-reports/html > /dev/null || true
          CodeChecker parse ./report --trim-path-prefix "$(pwd)" > /dev/null && touch ./ccOK || true

      - name: "Upload results"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CodeChecker report
          path: codechecker-reports

      - name: "Check results"
        run: |
          [ -f "./ccOK" ] || exit 1
